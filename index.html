<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DietDiary · 다이어트 루틴 다이어리</title>
  <meta name="description" content="식단 기록, 운동 스케줄, 다이어트 습관 루틴을 한 곳에서 관리하는 자기관리 앱">
  <meta name="theme-color" content="#F3F5F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1115" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DietDiary">
  <meta name="format-detection" content="telephone=no">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // 첫 화면 깜빡임 없이 테마 적용
    try {
      var t = (JSON.parse(localStorage.getItem('dietdiary:v1') || '{}').settings || {}).theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <main id="view" class="view" aria-live="polite"></main>
  <nav id="tabbar" class="tabbar" aria-label="메인 메뉴"></nav>
  <div id="layer"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px">DietDiary를 사용하려면 JavaScript를 켜주세요.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
